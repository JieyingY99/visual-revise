<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Upstream tools playground · Visual Revise e2e</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b0d; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  /* 左侧 x < 110 留给唤出后的 VisBug 工具条，右侧 x > 1100 留给属性面板 */
  #stage { position: absolute; left: 200px; top: 110px; width: 820px; }
  .tile { width: 140px; height: 70px; padding: 8px; background: #3a3a48; color: #fff; }
</style>
</head>
<body>
  <div id="stage">
    <!-- flex 容器 + 三个兄弟：Flexbox Align / Move 两个工具都用它 -->
    <div id="board" style="display:flex; gap:16px; padding:12px; background:#191920">
      <div class="tile" id="t0">Alpha</div>
      <div class="tile" id="t1">Beta</div>
      <div class="tile" id="t2">Gamma</div>
    </div>

    <!-- Move 工具的「沉入下一兄弟」需要一个有孩子的后邻 -->
    <div id="stack" style="margin-top:16px; padding:12px; background:#1b2028">
      <div class="tile" id="s0">S0</div>
      <div id="s1" style="padding:10px; background:#2a3340">
        <div class="tile" id="s1a" style="background:#46566a">S1A</div>
      </div>
    </div>

    <p id="para" style="margin:16px 0; padding:12px; width:420px; font-size:16px; line-height:24px;
                        letter-spacing:0px; font-weight:400; text-align:left; color:#dcdce6; background:#181820">
      Typography sample text for the font tool.
    </p>

    <div id="shadowbox" style="width:220px; height:80px; background:#2b2b36"></div>

    <div id="huebox" style="margin-top:16px; width:220px; height:80px; color:rgb(200,210,220);
                            background-color:rgb(60,90,120); border:2px solid rgb(80,80,100)">hue</div>

    <div id="pics" style="display:flex; gap:20px; margin-top:16px">
      <img id="picA" class="shot" width="120" height="70" alt="A"
           src="data:image/gif;base64,R0lGODlhAQABAIAAAP8AAAAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==">
      <img id="picB" class="shot" width="120" height="70" alt="B"
           src="data:image/gif;base64,R0lGODlhAQABAIAAAAD/AAAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==">
    </div>

    <div id="links" style="margin-top:16px">
      <a href="#one" class="lk">one</a>
      <a href="#two" class="lk">two</a>
      <button id="go" class="bt">go</button>
    </div>
  </div>
</body>
</html>
