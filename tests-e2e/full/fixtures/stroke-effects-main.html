<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Stroke / Effects fixture</title>
<style>
  /* 刻意不写 * { box-sizing: border-box }：默认 content-box 才能用几何量出
     「内 / 外」描边位置真的改了盒模型（border-box 时两者外观一样大） */
  :root { --vr-line: #ff5500; --vr-accent: #22aaff; --vr-space: 8px; }
  body { margin: 0; background: #0b0b0d; color: #eee; font-family: system-ui, sans-serif; }
  .box { position: absolute; width: 200px; height: 88px; border-radius: 6px; }

  /* 无描边：Stroke 分区应为空状态 */
  #plain  { left: 24px;  top: 100px; background: #2a3350; border: none; }
  /* 已有描边：三个字段 + 位置分段都该渲染，加号该 disabled */
  #edged  { left: 248px; top: 100px; background: #2a3350; border: 4px solid rgb(10, 20, 30); }

  /* 效果用的干净盒子，各测一种，避免同一条 CSS 属性互相吞掉 */
  #fx1    { left: 472px; top: 100px; background: #24506b; }
  #fx2    { left: 24px;  top: 210px; background: #24506b; }
  #fx3    { left: 248px; top: 210px; background: #24506b; }
  #fx4    { left: 472px; top: 210px; background: #24506b; }
  #fx5    { left: 24px;  top: 320px; background: #24506b; }
  #fx6    { left: 248px; top: 320px; background: #24506b; }
  #fx7    { left: 472px; top: 320px; background: #24506b; }

  /* 已经有两层填充（渐变 + 底色）：噪点 / 纹理要跟它们共用 background-image */
  #fxfill { left: 24px;  top: 430px;
            background-color: rgb(18, 52, 86);
            background-image: linear-gradient(90deg, rgb(255, 0, 0), rgb(0, 0, 255)); }
  #fxdrag { left: 248px; top: 430px; background: #24506b; }
  #fxlife { left: 472px; top: 430px; background: #24506b; }
</style>
</head>
<body>
  <div class="box" id="plain"></div>
  <div class="box" id="edged"></div>
  <div class="box" id="fx1"></div>
  <div class="box" id="fx2"></div>
  <div class="box" id="fx3"></div>
  <div class="box" id="fx4"></div>
  <div class="box" id="fx5"></div>
  <div class="box" id="fx6"></div>
  <div class="box" id="fx7"></div>
  <div class="box" id="fxfill"></div>
  <div class="box" id="fxdrag"></div>
  <div class="box" id="fxlife"></div>
</body>
</html>
